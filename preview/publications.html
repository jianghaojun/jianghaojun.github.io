    @media (max-width: 767.98px) { body { padding-top: 4.5rem; } .publication-cover { height: 210px; } }

</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container-lg">
      <a class="navbar-brand" href="/preview/"><strong>Haojun Jiang</strong></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#publicationNav" aria-controls="publicationNav" aria-expanded="false" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
      <div class="collapse navbar-collapse" id="publicationNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="/preview/">Home</a></li>
          <li class="nav-item active"><a class="nav-link" href="/preview/publications.html">Publications</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-lg">
    <div class="d-flex align-items-end justify-content-between mb-3">
      <div>
        <h1 class="h2 mb-1">Publications</h1>
        <p class="text-muted mb-0">19 publications across medical robotics, multimodal learning, and efficient deep learning.</p>
      </div>
      <a href="/preview/" class="btn btn-sm btn-outline-secondary no-break"><i class="fas fa-arrow-left mr-1"></i> Back home</a>
    </div>
    <div class="row">
      <div id="publication-groups" class="col-12 col-lg-10"></div>
      <aside class="col-2 d-none d-lg-block">
        <nav id="year-nav" class="nav nav-pills flex-column sticky-top year-nav" aria-label="Publication years"></nav>
      </aside>
    </div>
  </main>

  <footer class="footer border-top py-2 mt-5 bg-white small">
    <div class="container-lg"><div class="row my-3"><div class="col-6 text-muted"><i>Haojun Jiang · Academic Homepage</i></div><div class="col-6 text-right text-muted">AI for Healthcare &amp; Robotics</div></div></div>
  </footer>

  <script>
    const publications = [
      {year: 2026, title: "UltraHiT: A Hierarchical Transformer Architecture for Generalizable Internal Carotid Artery Robotic Ultrasonography", authors: ["Teng Wang*", "Haojun Jiang*", "Yuxuan Wang*", "Zhenguo Sun", "Xiangjie Yan", "Xiang Li", "Gao Huang"], venue: "ICRA 2026", url: "https://ultrahit-thu.github.io/UltraHiT/", cover: "/assets/images/covers/ultrahit.png?v=2"},
      {year: 2026, title: "VA-Adapter: Adapting Ultrasound Foundation Model to Echocardiography Probe Guidance", authors: ["Teng Wang*", "Haojun Jiang*", "Yuxuan Wang", "Zhenguo Sun", "Shiji Song", "Gao Huang"], venue: "MICCAI 2026 · Early Accept, Top 9%", url: "https://arxiv.org/abs/2510.06809"},
      {year: 2026, title: "UltraStar: Semantic-Aware Star Graph Modeling for Echocardiography Navigation", authors: ["Teng Wang*", "Haojun Jiang*", "Chenxi Li", "Diwen Wang", "Yihang Tang", "Zhenguo Sun", "Yujiao Deng", "Shiji Song", "Gao Huang"], venue: "MICCAI 2026", url: "https://arxiv.org/pdf/2603.01461"},
      {year: 2025, title: "UltraSeP: Sequence-aware Pre-training for Echocardiography Probe Guidance", authors: ["Haojun Jiang", "Teng Wang", "Zhenguo Sun", "Yulin Wang", "Yue Yang", "Yu Sun", "Ning Jia", "Meng Li", "Shaqi Luo", "Shiji Song", "Gao Huang"], venue: "Pattern Recognition 2025 · IF = 9.1", url: "https://www.sciencedirect.com/science/article/pii/S0031320325012634", cover: "/assets/images/covers/ultrasep.png"},
      {year: 2025, title: "Towards AI-guided Cardiovascular Ultrasonography with Large-scale Implicit Structural Learning", authors: ["Haojun Jiang", "Gao Huang"], venue: "MICCAI Doctoral Consortium 2025 · MICCAI Best Ph.D. Thesis First Runner-Up Award", url: "https://drive.google.com/file/d/1TIGpp735KtwBL4coieHFdGGkqbq6wTcb/view", cover: "/assets/images/covers/miccai25_thesis.png"},
      {year: 2025, title: "Emulating Human-like Adaptive Vision for Efficient and Flexible Machine Visual Perception", authors: ["Yulin Wang*", "Yang Yue (乐洋)*", "Yang Yue (乐阳)*", "Huanqian Wang", "Haojun Jiang", "Yizeng Han", "Zanlin Ni", "Yifan Pu", "Minglei Shi", "Rui Lu", "Qisen Yang", "Andrew Zhao", "Zhuofan Xia", "Shiji Song", "Gao Huang"], venue: "Nature Machine Intelligence 2025", url: "https://arxiv.org/abs/2509.15333"},
      {year: 2025, title: "UltraBot: Towards Expert-level Autonomous Carotid Ultrasonography with Large-scale Learning-based Robotic System", authors: ["Haojun Jiang*", "Andrew Zhao*", "Qian Yang*", "Xiangjie Yan", "Teng Wang", "Yulin Wang", "Ning Jia", "Jiangshan Wang", "Guokun Wu", "Yang Yue", "Shaqi Luo", "Huanqian Wang", "Ling Ren", "Siming Chen", "Pan Liu", "Guocai Yao", "Wenming Yang", "Shiji Song", "Xiang Li", "Kunlun He", "Gao Huang"], venue: "Nature Communications 2025 · IF = 18.1 · Nature Biomedical Engineering Chief Editor Highlight", url: "https://www.nature.com/articles/s41467-025-62865-w", cover: "/assets/images/covers/ultrabot.png?v=2"},
      {year: 2025, title: "EchoWorld: Learning Motion-Aware World Models for Echocardiography Probe Guidance", authors: ["Yang Yue*", "Yulin Wang*", "Haojun Jiang", "Pan Liu", "Shiji Song", "Gao Huang"], venue: "CVPR 2025", url: "https://openaccess.thecvf.com/content/CVPR2025/papers/Yue_EchoWorld_Learning_Motion-Aware_World_Models_for_Echocardiography_Probe_Guidance_CVPR_2025_paper.pdf"},
      {year: 2025, title: "Cross-modal Adapter for Vision–Language Retrieval", authors: ["Haojun Jiang", "Jianke Zhang", "Rui Huang", "Chunjiang Ge", "Zanlin Ni", "Shiji Song", "Gao Huang"], venue: "Pattern Recognition 2025", url: "https://www.sciencedirect.com/science/article/pii/S0031320324008951", cover: "/assets/images/covers/cross-modal-adapter.png"},
      {year: 2024, title: "UltraCopilot: Cardiac Copilot: Automatic Probe Guidance for Echocardiography with World Model", authors: ["Haojun Jiang*", "Zhenguo Sun*", "Ning Jia", "Meng Li", "Yu Sun", "Shaqi Luo", "Shiji Song", "Gao Huang"], venue: "MICCAI 2024 · Early Accept", url: "https://link.springer.com/chapter/10.1007/978-3-031-72378-0_18", cover: "/assets/images/covers/ultracopilot.png"},
      {year: 2024, title: "Structure-aware World Model for Probe Guidance via Large-scale Self-supervised Pre-train", authors: ["Haojun Jiang*", "Meng Li*", "Zhenguo Sun*", "Ning Jia", "Yu Sun", "Shaqi Luo", "Shiji Song", "Gao Huang"], venue: "MICCAI ASMUS Workshop 2024 · Oral", url: "https://arxiv.org/pdf/2406.19756"},
      {year: 2024, title: "Joint Representation Learning for Text and 3D Point Cloud", authors: ["Rui Huang*", "Xuran Pan*", "Henry Zheng", "Haojun Jiang", "Zhifeng Xie", "Shiji Song", "Gao Huang"], venue: "Pattern Recognition 2024", url: "https://arxiv.org/pdf/2301.07584"},
      {year: 2023, title: "Deep Incubation: Training Large Models by Divide-and-Conquering", authors: ["Zanlin Ni*", "Yulin Wang*", "Jiangwei Yu", "Haojun Jiang", "Yue Cao", "Gao Huang"], venue: "ICCV 2023", url: "https://openaccess.thecvf.com/content/ICCV2023/papers/Ni_Deep_Incubation_Training_Large_Models_by_Divide-and-Conquering_ICCV_2023_paper.pdf"},
      {year: 2022, title: "Pseudo-Q: Generating Pseudo Language Queries for Visual Grounding", authors: ["Haojun Jiang*", "Yuanze Lin*", "Dongchen Han", "Shiji Song", "Gao Huang"], venue: "CVPR 2022", url: "https://arxiv.org/abs/2203.08481", cover: "/assets/images/covers/pseudo-q.png"},
      {year: 2022, title: "AdaFocus V2: End-to-End Training of Spatial Dynamic Networks for Video Recognition", authors: ["Yulin Wang*", "Yue Yang*", "Yuanze Lin", "Haojun Jiang", "Zihang Lai", "Victor Kulikov", "Nikita Orlov", "Humphrey Shi", "Gao Huang"], venue: "CVPR 2022", url: "https://arxiv.org/pdf/2112.14238"},
      {year: 2022, title: "Glance and Focus Networks for Dynamic Visual Recognition", authors: ["Gao Huang*", "Yulin Wang*", "Kangchen Lv", "Haojun Jiang", "Wenhui Huang", "Pengfei Qi", "Shiji Song"], venue: "IEEE TPAMI 2022", url: "https://arxiv.org/pdf/2201.03014"},
      {year: 2021, title: "Adaptive Focus for Efficient Video Recognition", authors: ["Yulin Wang*", "Zhaoxi Chen*", "Haojun Jiang", "Shiji Song", "Yizeng Han", "Gao Huang"], venue: "ICCV 2021 · Oral", url: "https://openaccess.thecvf.com/content/ICCV2021/papers/Wang_Adaptive_Focus_for_Efficient_Video_Recognition_ICCV_2021_paper.pdf"},
      {year: 2021, title: "CondenseNet V2: Sparse Feature Reactivation for Deep Networks", authors: ["Le Yang*", "Haojun Jiang*", "Ruojin Cai", "Yulin Wang", "Shiji Song", "Gao Huang", "Qi Tian"], venue: "CVPR 2021", url: "https://arxiv.org/abs/2104.04382", cover: "/assets/images/covers/condensenet-v2.png"},
      {year: 2021, title: "Spatially Adaptive Feature Refinement for Efficient Inference", authors: ["Yizeng Han", "Gao Huang", "Shiji Song", "Le Yang", "Yitian Zhang", "Haojun Jiang"], venue: "IEEE TIP 2021", url: "http://drive.google.com/file/d/1ssb-FfphaJ69q0qp2wGUC_QP0bal3_0D/view"}
    ];

    const groups = document.getElementById("publication-groups");
    const yearNav = document.getElementById("year-nav");
    const years = [...new Set(publications.map(item => item.year))];

    years.forEach(year => {
      const heading = document.createElement("h2");
      heading.className = "h4 pt-3 year-heading";
      heading.id = `year-${year}`;
      heading.textContent = year;
      groups.appendChild(heading);

      const list = document.createElement("section");
      list.className = "publication-list bg-white shadow-sm rounded-xl mb-3";

      publications.filter(item => item.year === year).forEach((item, index, items) => {
        const article = document.createElement("article");
        article.className = `publication-entry row no-gutters ${index < items.length - 1 ? "border-bottom" : ""}`;
        const visual = item.cover
          ? `<div class="col-md-3 p-3"><img src="${item.cover}" alt="" class="publication-cover rounded-sm"></div>`
          : `<div class="col-md-3 p-3 d-none d-md-block"><div class="rounded-sm h-100 d-flex align-items-center justify-content-center text-white" style="min-height:88px;background:linear-gradient(135deg,#102a43,#155eef)"><i class="fas fa-file-lines fa-2x"></i></div></div>`;
        const authorLine = item.authors.map(author => author.replace("Haojun Jiang", "<strong>Haojun Jiang</strong>")).join(", ");
        article.innerHTML = `${visual}<div class="col-md-9 p-3 pl-md-0"><h2 class="h5 font-weight-normal mb-1">${item.title}</h2><p class="small mb-2">${authorLine}</p><p class="small text-muted mb-2"><em>${item.venue}</em></p><a class="small" href="${item.url}" target="_blank" rel="noopener">[Paper / Project]</a></div>`;
        list.appendChild(article);
      });
      groups.appendChild(list);

      const navLink = document.createElement("a");
      navLink.className = "nav-link";
      navLink.href = `#year-${year}`;
      navLink.textContent = year;
      yearNav.appendChild(navLink);
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
