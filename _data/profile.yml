short_bio: >-
  <p>I work on AI for healthcare and robotics, with a particular focus on autonomous medical robots.</p>

  <p>I am currently a postdoctoral researcher at <a href="https://www.jhu.edu/" target="_blank">Johns Hopkins University</a>, working with <a href="https://engineering.jhu.edu/faculty/mathias-unberath/" target="_blank">Mathias Unberath</a> and <a href="https://engineering.jhu.edu/faculty/axel-krieger/" target="_blank">Axel Krieger</a> on surgical automation.</p>

  <p>Previously, I completed my Ph.D. at <a href="https://www.leaplab.ai/" target="_blank">LEAPLab</a> in the <a href="https://www.au.tsinghua.edu.cn/en/" target="_blank">Department of Automation</a> at <a href="https://www.tsinghua.edu.cn/en/" target="_blank">Tsinghua University</a>, under the supervision of <a href="https://gaohuang-net.github.io/" target="_blank">Prof. Gao Huang</a>, whose research has garnered more than 110,000 citations on Google Scholar. At Tsinghua, I led research on autonomous robotic ultrasonography. Our carotid ultrasound robot <a href="https://www.nature.com/articles/s41467-025-62865-w" target="_blank">UltraBot</a> appeared in <em>Nature Communications</em> and was highlighted by the Chief Editor of <em>Nature Biomedical Engineering</em>. My Ph.D. thesis received the MICCAI Best Ph.D. Thesis First Runner-Up Award and the Tsinghua Excellent Doctoral Dissertation Award. Before that, I received my B.Eng. degree in Automation at <a href="https://www.tsinghua.edu.cn/en/" target="_blank">Tsinghua University</a>.</p>

  <p>If you are interested in my research, please feel free to reach out—I would be happy to discuss potential ideas and opportunities for collaboration.</p>


